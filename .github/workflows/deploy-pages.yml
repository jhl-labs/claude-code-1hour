name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/plan-01-scaffold
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 — 새 푸시가 진행 중인 배포를 대체
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 저장소가 jhl-labs/claude-code-1hour 이므로 사이트는 /claude-code-1hour/ 하위로 서빙됨
      NEXT_PUBLIC_BASE_PATH: /claude-code-1hour
    steps:
      - uses: actions/checkout@v4

      # version 은 package.json 의 "packageManager" 필드에서 자동 인식
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (next export -> out/)
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
